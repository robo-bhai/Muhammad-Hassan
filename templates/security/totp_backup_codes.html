{% extends 'base.html' %}
{% block title %}Backup codes{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:520px">
  <h1 class="h4 mb-2">Your backup codes</h1>
  <p class="text-muted">Each code works once if you lose your phone. They are shown <strong>only now</strong> - print or store them safely.</p>
  <div class="card card-body mb-3"><ul class="list-unstyled mb-0 fs-5 font-monospace">
    {% for c in codes %}<li>{{ c }}</li>{% endfor %}
  </ul></div>
  <a class="btn btn-primary" href="{% url 'security_dashboard' %}">Done</a>
</div>
{% endblock %}
