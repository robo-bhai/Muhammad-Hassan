<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password - {{ company_name }}</title>
<style>
:root{--p:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--ink:#e5e7eb;--muted:#94a3b8;--line:#334155;--bg:#0f172a}.card{background:#1e293b!important}input{background:#0f172a!important;color:var(--ink)!important}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding:16px}
.card{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
h1{margin:0 0 6px;font-size:22px}.sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;margin:12px 0 6px;font-size:13px;font-weight:600}
input{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#f8fafc}
input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{width:100%;height:48px;margin-top:18px;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.m{margin-bottom:12px;padding:10px 12px;border-radius:10px;font-size:14px;background:#eff6ff;color:#1e40af}.m.error{background:#fef2f2;color:#b91c1c}.m.success{background:#ecfdf5;color:#047857}
.back{margin-top:16px;text-align:center;font-size:14px}.back a{color:var(--p);text-decoration:none}.hint{font-size:12px;color:var(--muted);margin-top:4px}
</style></head><body>
<div class="card">
  <h1>Reset password</h1>
  <p class="sub">Account: <b>{{ username }}</b></p>
  {% for m in messages %}<div class="m {{ m.tags }}">{{ m }}</div>{% endfor %}
  <form method="post" autocomplete="off">{% csrf_token %}
    <label for="code">Email code (6 digits)</label>
    <input id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
    <label for="totp_code">Authenticator / backup code</label>
    <input id="totp_code" name="totp_code" autocomplete="off">
    <div class="hint">Agar aap ke account par authenticator app enabled hai to zaroori hai, warna khali chor dein.</div>
    <label for="password">New password</label>
    <input id="password" type="password" name="password" required autocomplete="new-password">
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password">
    <button class="btn" type="submit">Change password</button>
  </form>
  <div class="back"><a href="{% url 'admin_forgot_password' %}">Code nahi mila? Dobara bhejein</a> &nbsp;|&nbsp; <a href="{% url 'login' %}">Sign in</a></div>
</div></body></html>
