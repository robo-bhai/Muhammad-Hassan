<div style="background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 8px rgba(0,0,0,.06)">
  <strong>📍 Store ki location</strong>
  <p style="margin:6px 0;color:#6b7280;font-size:13px">Is se nazdeek rider ko pehle offer milta hai. Ye button store par khade ho kar dabayein.</p>
  <button type="button" id="setStoreLoc" style="padding:10px 14px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;font-weight:700">
    {% if profile.lat %}✅ Location set hai — dobara set karein{% else %}📍 Meri location set karein{% endif %}</button>
  <small id="storeLocMsg" style="margin-left:8px"></small>
</div>
<script>
(function(){
  var b=document.getElementById('setStoreLoc'), m=document.getElementById('storeLocMsg');
  b.addEventListener('click',function(){
    if(!navigator.geolocation){m.textContent='Browser location support nahi karta';return;}
    m.textContent='Location le raha hoon...';
    navigator.geolocation.getCurrentPosition(function(p){
      var body=new URLSearchParams(); body.append('lat',p.coords.latitude); body.append('lng',p.coords.longitude);
      fetch("{% url 'vendor_set_location' %}",{method:'POST',credentials:'same-origin',
        headers:{'X-CSRFToken':"{{ csrf_token }}",'Content-Type':'application/x-www-form-urlencoded'},body:body})
        .then(function(r){return r.json()}).then(function(d){m.textContent=d.ok?'✅ Save ho gayi':'❌ Save nahi hui';})
        .catch(function(){m.textContent='❌ Network masla';});
    },function(){m.textContent='❌ Location ki ijazat dein';},{enableHighAccuracy:true,timeout:20000});
  });
})();
</script>
