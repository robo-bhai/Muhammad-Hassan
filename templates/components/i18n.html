{# Language: RTL styles, Urdu font and the text translator (loads only when the language is not English). #}
{% load static %}{% if LANG_CODE and LANG_CODE != 'en' %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== RTL (Urdu) ===== */
@font-face { font-family: "Jameel Noori Nastaleeq"; src: url("{% static 'fonts/JameelNooriNastaleeq.woff' %}") format("woff"); font-weight: 400; font-style: normal; font-display: swap; }
html[dir="rtl"] { --erp-rtl-font: "Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif; }
html[lang="ur"] { --erp-rtl-font: "Jameel Noori Nastaleeq", "Noto Nastaliq Urdu", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif; }
/* ===== Urdu (Nastaleeq) professional typography ===== */
html[lang="ur"] body { font-size: 1.08rem; line-height: 2.05; font-synthesis: none; text-rendering: optimizeLegibility; font-feature-settings: "liga" 1, "calt" 1, "kern" 1; letter-spacing: 0; word-spacing: .05em; }
html[lang="ur"] body, html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4, html[lang="ur"] h5, html[lang="ur"] h6,
html[lang="ur"] p, html[lang="ur"] a, html[lang="ur"] span, html[lang="ur"] li, html[lang="ur"] label, html[lang="ur"] small, html[lang="ur"] div,
html[lang="ur"] th, html[lang="ur"] td, html[lang="ur"] button, html[lang="ur"] .btn, html[lang="ur"] .badge, html[lang="ur"] .nav-link, html[lang="ur"] .dropdown-item,
html[lang="ur"] input, html[lang="ur"] select, html[lang="ur"] textarea, html[lang="ur"] .form-control, html[lang="ur"] .form-select { font-family: var(--erp-rtl-font); }
/* Jameel Noori has one weight only: never fake bold (looks smeared); use size + colour for emphasis instead */
html[lang="ur"] b, html[lang="ur"] strong, html[lang="ur"] th, html[lang="ur"] h1, html[lang="ur"] h2, html[lang="ur"] h3, html[lang="ur"] h4, html[lang="ur"] h5, html[lang="ur"] h6,
html[lang="ur"] .fw-bold, html[lang="ur"] .fw-semibold, html[lang="ur"] .btn, html[lang="ur"] .card-title, html[lang="ur"] .navbar-brand { font-weight: 400 !important; }
html[lang="ur"] h1 { font-size: 2.1rem; line-height: 1.9; } html[lang="ur"] h2 { font-size: 1.75rem; line-height: 1.9; }
html[lang="ur"] h3 { font-size: 1.5rem; line-height: 1.9; } html[lang="ur"] h4 { font-size: 1.3rem; line-height: 1.9; }
html[lang="ur"] h5 { font-size: 1.18rem; line-height: 1.9; } html[lang="ur"] h6 { font-size: 1.08rem; line-height: 1.9; }
html[lang="ur"] small, html[lang="ur"] .small, html[lang="ur"] .text-muted { font-size: .95em; }
/* Nastaleeq glyphs are tall: give controls room so nothing is clipped */
html[lang="ur"] .btn { line-height: 1.9; padding-top: .28rem; padding-bottom: .1rem; }
html[lang="ur"] .btn-sm { line-height: 1.8; padding-top: .2rem; padding-bottom: .05rem; }
html[lang="ur"] .badge { line-height: 1.9; padding: .2em .65em .05em; }
html[lang="ur"] .form-control, html[lang="ur"] .form-select { line-height: 1.9; min-height: calc(2.1em + 1.2rem); padding-top: .45rem; padding-bottom: .25rem; }
html[lang="ur"] .form-label, html[lang="ur"] label { margin-bottom: .2rem; }
html[lang="ur"] .nav-link, html[lang="ur"] .dropdown-item, html[lang="ur"] .sidebar-menu li a, html[lang="ur"] .sub-link { line-height: 1.95; padding-top: .45rem; padding-bottom: .3rem; }
html[lang="ur"] table th, html[lang="ur"] table td { line-height: 1.95; vertical-align: middle; }
html[lang="ur"] th { font-size: 1.02em; white-space: nowrap; }
html[lang="ur"] .alert, html[lang="ur"] .toast, html[lang="ur"] .modal-title, html[lang="ur"] .card-header { line-height: 1.95; }
html[lang="ur"] .modal-title { font-size: 1.35rem; }
/* numbers, codes, money, phone, dates stay Latin / left-to-right inside Urdu sentences */
html[lang="ur"] .num, html[lang="ur"] .amount, html[lang="ur"] .price, html[lang="ur"] [data-ltr], html[lang="ur"] code,
html[lang="ur"] input[type="number"], html[lang="ur"] input[type="tel"], html[lang="ur"] input[type="email"], html[lang="ur"] input[type="password"], html[lang="ur"] input[type="url"] { unicode-bidi: plaintext; font-variant-numeric: lining-nums; }
html[lang="ur"] code, html[lang="ur"] pre, html[lang="ur"] kbd { font-family: Consolas, "Courier New", monospace; direction: ltr; unicode-bidi: embed; }
/* icons keep their own font */
html[lang="ur"] .bi, html[lang="ur"] [class^="bi-"], html[lang="ur"] [class*=" bi-"] { font-family: "bootstrap-icons" !important; line-height: 1; vertical-align: -.125em; }
html[lang="ur"] .fa, html[lang="ur"] .fas, html[lang="ur"] .far, html[lang="ur"] .fab { font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", FontAwesome; }
/* Urdu shown in print stays crisp */
@media print { html[lang="ur"] body { font-size: 12pt; line-height: 1.9; } }
html[dir="rtl"] body, html[dir="rtl"] .btn, html[dir="rtl"] input, html[dir="rtl"] select,
html[dir="rtl"] textarea, html[dir="rtl"] .form-control, html[dir="rtl"] .form-select { font-family: var(--erp-rtl-font) !important; }
html[dir="rtl"] body { line-height: 1.7; }
html[lang="ur"][dir="rtl"] body { line-height: 2.05; }
/* layout */
html[dir="rtl"] .sidebar { left: auto; right: 0; border-right: 0; border-left: 1px solid rgba(255,255,255,.08); box-shadow: -4px 0 30px rgba(0,0,0,.35); }
html[dir="rtl"] .main-wrapper { margin-left: 0; margin-right: var(--sidebar-width); }
@media (max-width: 991px) {
  html[dir="rtl"] .sidebar { transform: translateX(100%); }
  html[dir="rtl"] .sidebar.mobile-show { transform: translateX(0); }
  html[dir="rtl"] .main-wrapper { margin-right: 0; }
}
/* sidebar items */
html[dir="rtl"] .sidebar-menu li a { border-left: 0; border-right: 3px solid transparent; }
html[dir="rtl"] .sidebar-menu li a:hover, html[dir="rtl"] .sidebar-menu li a.active { border-left-color: transparent; border-right-color: var(--sidebar-accent, #667eea); }
html[dir="rtl"] .sidebar-menu > li > a.active::before,
html[dir="rtl"] .sidebar-menu > .has-submenu > a[aria-expanded="true"]::before { left: auto; right: -12px; border-radius: 4px 0 0 4px; }
html[dir="rtl"] .arrow-icon, html[dir="rtl"] .badge-alert, html[dir="rtl"] .sub-link .badge,
html[dir="rtl"] .suggestion-item .remove-history { margin-left: 0; margin-right: auto; }
html[dir="rtl"] .sidebar-menu .collapse { margin: 2px 28px 6px 12px; padding: 2px 10px 2px 0; }
html[dir="rtl"] .sidebar-menu .collapse::before { left: auto; right: 0; }
html[dir="rtl"] .sub-link { border-left: 1px solid transparent !important; }
html[dir="rtl"] .sub-link:hover, html[dir="rtl"] .sub-link.active { padding-left: 10px !important; padding-right: 12px !important; }
html[dir="rtl"] .sub-link.active::before { left: auto; right: -11px; }
html[dir="rtl"] #biSubmenu .sub-link--nested { margin-left: 0; margin-right: 26px; }
html[dir="rtl"] #biSubmenu .sub-link--nested::before { left: auto; right: -9px; }
html[dir="rtl"] .search-item { border-left: 0; border-right: 3px solid transparent; }
html[dir="rtl"] .search-item:hover, html[dir="rtl"] .search-item.active { border-left-color: transparent; border-right-color: #667eea; padding-left: 12px; padding-right: 15px; }
/* misc */
html[dir="rtl"] .alert { border-left-width: 1px; border-right-width: 4px; }
html[dir="rtl"] .stat-card.danger-border { border-left: 0; border-right: 4px solid #dc3545; }
html[dir="rtl"] .global-toast { border-left: 0; border-right: 4px solid; }
html[dir="rtl"] input[type="number"], html[dir="rtl"] input[type="tel"], html[dir="rtl"] input[type="email"],
html[dir="rtl"] input[type="url"], html[dir="rtl"] input[type="password"] { direction: ltr; text-align: right; }
html[dir="rtl"] .table { text-align: right; }
/* portals: shop, rider, shareholder, CEO */
html[dir="rtl"] .shop-navbar .container, html[dir="rtl"] .shareholder-navbar, html[dir="rtl"] .nav-links { direction: rtl; }
html[dir="rtl"] .text-start { text-align: right !important; }
html[dir="rtl"] .text-end { text-align: left !important; }
html[dir="rtl"] .me-1, html[dir="rtl"] .me-2, html[dir="rtl"] .me-3 { margin-right: 0 !important; margin-left: .35rem !important; }
html[dir="rtl"] .ms-1, html[dir="rtl"] .ms-2, html[dir="rtl"] .ms-3 { margin-left: 0 !important; margin-right: .35rem !important; }
html[dir="rtl"] .ceo-sidebar, html[dir="rtl"] .exec-sidebar { right: 0; left: auto; }
html[dir="rtl"] .dropdown-menu { text-align: right; }
</style>
<script>window.ERP_LANG = "{{ LANG_CODE }}"; window.ERP_COLLECT = "{% if I18N_COLLECT %}{% url 'i18n_collect' %}{% endif %}"; window.ERP_CSRF = "{% if I18N_COLLECT %}{{ csrf_token }}{% endif %}";</script>
<script src="{% url 'i18n_dictionary' LANG_CODE %}?v={{ I18N_VERSION }}"></script>
{% verbatim %}<script>
(function () {
  var L = window.ERP_LANG || 'en';
  if (L === 'en') return;
  var D = window.ERP_I18N || {};
  var RE = /^([^\p{L}\p{N}]*)([\s\S]*?)([^\p{L}\p{N}]*)$/u;
  var SKIP = {SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1, CODE: 1, PRE: 1};
  var ATTRS = ['placeholder', 'title', 'aria-label'];
  // Only menu / button / heading style text is ever reported as "missing" (never table data or names)
  var UI_SEL = '.sidebar, .topbar, button, .btn, label, th, h1, h2, h3, h4, h5, h6, .nav-link, .dropdown-item, ' +
               '.breadcrumb-item, .card-header, .modal-title, .page-title, legend, .form-label';
  var VALID = /^[A-Za-z][A-Za-z0-9 &'\u2019()\/.,:+\-%?!#]*$/;
  var pending = {}, pendingN = 0, sentKey = 'erp_i18n_sent', sent = {};
  try { sent = JSON.parse(sessionStorage.getItem(sentKey) || '{}'); } catch (e) { sent = {}; }

  function lookup(s) {
    if (!s) return null;
    var t = s.replace(/\s+/g, ' ').trim();
    if (!t) return null;
    var m = RE.exec(t);
    if (!m) return null;
    var lead = m[1], core = m[2], trail = m[3];
    var v = D[(core + trail).toLowerCase()];
    if (v) return {lead: lead, out: v, trail: ''};
    v = D[core.toLowerCase()];
    if (v) return {lead: lead, out: v, trail: trail};
    return null;
  }

  function tr(s) {
    var r = lookup(s);
    if (!r) return null;
    var w1 = /^\s*/.exec(s)[0], w2 = /\s*$/.exec(s)[0];
    return w1 + r.lead + r.out + r.trail + w2;
  }

  function skipNode(el) {
    for (; el && el.nodeType === 1; el = el.parentNode) {
      if (SKIP[el.tagName] || el.hasAttribute('data-no-i18n') || el.isContentEditable) return true;
    }
    return false;
  }

  function consider(text, el) {
    if (!window.ERP_COLLECT || !el || !el.closest || !el.closest(UI_SEL)) return;
    var t = text.replace(/\s+/g, ' ').trim().replace(/^[^\w(]+/, '').replace(/[ :.\u2026!?*]+$/, '');
    if (t.length < 2 || t.length > 100 || !VALID.test(t) || t.split(' ').length > 7) return;
    if (/\d/.test(t)) return;
    var k = t.toLowerCase();
    if (sent[k] || pending[k]) return;
    pending[k] = t; pendingN++;
  }

  var flushTimer = null;
  function flush() {
    flushTimer = null;
    if (!pendingN || !window.ERP_COLLECT) return;
    var items = Object.keys(pending).map(function (k) { return pending[k]; }).slice(0, 100);
    items.forEach(function (t) { sent[t.toLowerCase()] = 1; delete pending[t.toLowerCase()]; pendingN--; });
    try { sessionStorage.setItem(sentKey, JSON.stringify(sent)); } catch (e) {}
    fetch(window.ERP_COLLECT, {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': window.ERP_CSRF || ''},
      body: JSON.stringify({items: items})
    }).catch(function () {});
    if (pendingN) flushTimer = setTimeout(flush, 3000);
  }

  function run(root) {
    root = root || document.body;
    if (!root) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) {
      if (n.__i18n === n.nodeValue) continue;
      if (skipNode(n.parentNode)) continue;
      var out = tr(n.nodeValue);
      if (out !== null && out !== n.nodeValue) { n.__i18n = out; n.nodeValue = out; }
      else if (out === null) consider(n.nodeValue, n.parentNode);

      if (skipNode(el)) continue;
      ATTRS.forEach(function (a) {
        var v = el.getAttribute(a);
        if (v) { var o = tr(v); if (o !== null && o !== v) el.setAttribute(a, o); }

    timer = setTimeout(function () {

</script>{% endverbatim %}
{% endif %}
