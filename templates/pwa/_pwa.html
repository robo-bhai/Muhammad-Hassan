{% load pwa_portal static %}
{% pwa_portal_meta %}
<script>
/* Service worker + "Update available" bar. */
if ('serviceWorker' in navigator) {
  (function () {
    var userAsked = false;
    function updateBar(reg) {
      if (document.getElementById('pwa-update-bar')) return;
      var mk = function () {
        var b = document.createElement('div');
        b.id = 'pwa-update-bar';
        b.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:100000;background:#111827;color:#fff;' +
          'border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);' +
          'font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto';
        b.innerHTML = '<span style="flex:1">🔄 Naya version available hai</span>' +
          '<button id="pwa-refresh" style="background:#22c55e;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600">Refresh</button>' +
          '<button id="pwa-later" aria-label="Later" style="background:transparent;color:#fff;border:0;font-size:20px;line-height:1">&times;</button>';
        document.body.appendChild(b);
        document.getElementById('pwa-later').onclick = function () { b.remove(); };
        document.getElementById('pwa-refresh').onclick = function () {
          userAsked = true;
          if (reg.waiting) reg.waiting.postMessage({type: 'SKIP_WAITING'}); else location.reload();
        };
      };
      if (document.body) mk(); else document.addEventListener('DOMContentLoaded', mk);
    }
    function watch(reg) {
      if (reg.waiting && navigator.serviceWorker.controller) updateBar(reg);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) updateBar(reg);
        });
      });
    }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (userAsked) { userAsked = false; location.reload(); }   // sirf user ke Refresh par reload
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/serviceworker.js', {scope: '/'}).then(function () {
        return navigator.serviceWorker.getRegistration();   // is page ko control karne wali registration (/shop/ par push worker)
      }).then(function (reg) {
        if (!reg) return;
        watch(reg);
        var check = function () { reg.update().catch(function () {}); };
        setInterval(check, 30 * 60 * 1000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      }).catch(function (e) { console.log('SW error', e); });
    });
  })();
}
</script>
<meta name="mobile-web-app-capable" content="yes">
<script>
/* Install button (Android/Chrome/Edge) + iPhone hint. */
(function () {
  var CFG = {% pwa_install_cfg %};   // Settings > App Install
  var deferred = null, KEY = 'pwa_install_dismissed';
  function standalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function bar(html, onclick) {
    if (document.getElementById('pwa-install-bar')) return;
    var b = document.createElement('div');
    b.id = 'pwa-install-bar';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#0d6efd;color:#fff;' +
      'border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);' +
      'font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto';
    b.innerHTML = '<span style="flex:1">' + html + '</span>' +
      (onclick ? '<button id="pwa-yes" style="background:#fff;color:#0d6efd;border:0;border-radius:8px;padding:8px 14px;font-weight:600">Install</button>' : '') +
      '<button id="pwa-no" aria-label="Close" style="background:transparent;color:#fff;border:0;font-size:20px;line-height:1">&times;</button>';
    document.body.appendChild(b);
    document.getElementById('pwa-no').onclick = function () {
      try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      b.remove();
    };
    if (onclick) document.getElementById('pwa-yes').onclick = function () { onclick(); b.remove(); };
  }
  function dismissed() {
    if (!CFG.on) return true;   // setting OFF: bar kabhi nahi
    try { var t = +localStorage.getItem(KEY); return t && t > CFG.since && Date.now() - t < 7 * 864e5; } catch (e) { return false; }
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (standalone() || dismissed()) return;
    var show = function () {
      bar('📲 App install karein — home screen se seedha khulegi', function () {
        deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; });
      });
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  });
  window.addEventListener('appinstalled', function () {
    var b = document.getElementById('pwa-install-bar'); if (b) b.remove();
  });
  document.addEventListener('DOMContentLoaded', function () {
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    if (ios && !standalone() && !dismissed()) {
      bar('iPhone: Share ⬆️ dabayein phir <b>Add to Home Screen</b>', null);
    }
  });
})();
</script>
<script src="{% static 'js/pwa_speed.js' %}" defer></script>
