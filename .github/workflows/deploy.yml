name: Django CI/CD Pipeline

# DB design: MySQL runs ONLY on the GitHub runner (service container).
# Persistence = encrypted snapshot stored in the GitHub Actions CACHE (no rclone / Google Drive).
#   start of run : restore latest cache entry -> local MySQL (first ever run: fresh DB)
#   every 30 min : local snapshot only (cache can only be saved at the end of the job)
#   end of run   : stop server, final snapshot -> save as new cache entry, keep latest 3
# Note: GitHub deletes cache entries not used for 7 days, so keep the workflow running at least weekly.
# EXPORT: every run also uploads the encrypted snapshot as an Artifact (keeps latest 3, 14 days) so you can download a copy.
# SERVER: gunicorn (1 worker, 8 threads) + WhiteNoise for /static/; automatic fallback to runserver if gunicorn cannot start.
# FAST RESTART: (1) pip + cloudflared are cached and installed BEFORE waiting for the old run; (2) the old run keeps
#   serving until the new run has finished installing (max 8 min), so the site is only down for stop + snapshot + restore.
# AUTO-RESTART: GitHub kills any job at 6 hours. After ~5h10m this run starts a NEW run of itself
#   (workflow_dispatch). The new run waits for this one, this one sees the newer run, stops the server,
#   takes the final snapshot, and the new run restores it and goes live again (a few minutes gap only).

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      restore_action:
        description: 'Empty = latest. Or snapshot file name to restore, or "list" to print available snapshots.'
        required: false
        default: ''
  repository_dispatch:
    types: [ backup_now, restore_now, migrate_now ]

permissions:
  contents: read
  actions: write   # needed to delete old cache entries

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    services:
      local-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_django_db
        ports:
          - 3306:3306
        options: "--health-cmd=\"mysqladmin ping -proot\" --health-interval=10s --health-timeout=5s --health-retries=10"

        
        
    env:
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      # Pictures/media Cloudinary pe save hon (runner restart pe local media/ khali ho jata hai)
      MEDIA_STORAGE: "cloudinary"
      CI_MODE: 'true'
      # Django -> runner-local MySQL (hardcoded, no secrets needed)
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASS: "root"
      DB_NAME: "local_django_db"
      BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
      SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      # WhatsApp automatic order updates (Meta Cloud API); khali ho to kuch nahi jata
      WHATSAPP_CLOUD_TOKEN: ${{ secrets.WHATSAPP_CLOUD_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      # Fixed Cloudflare tunnel domain
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      SITE_DOMAIN: "kwl.uqn88.store"
      ALLOWED_HOSTS: "kwl.uqn88.store,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://kwl.uqn88.store"
      # License: fixed machine id (runner machine-id changes every run) + optional first-time key
      LICENSE_MACHINE_SEED: ${{ secrets.LICENSE_MACHINE_SEED }}
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
      PYTHONUNBUFFERED: "1"
      RUNNING_IN_TERMUX: "false"

    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore pip cache
        id: pip_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py313-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py313-

      - name: Install Pips & System Tools
        run: |
          # apt-get update sirf tab jab seedhi install na ho (tez)
          PKGS="mysql-client-core-8.0 libmysqlclient-dev pkg-config build-essential"
          sudo apt-get install -y --no-install-recommends $PKGS \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends $PKGS; }
          python -m pip install --upgrade pip
          pip install mysqlclient gunicorn "django-import-export>=3.3.0" "django>=5.2,<5.3" django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode cryptography python-dotenv requests django-pwa whitenoise django-cloudinary-storage rembg numpy

      - name: Save pip cache (right after install, not at job end)
        if: steps.pip_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py313-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Cloudflared cache key (refreshes monthly)
        run: echo "CF_MONTH=$(date +%Y-%m)" >> "$GITHUB_ENV"

      - name: Restore cloudflared binary cache
        id: cf_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/cf-bin
          key: cloudflared-linux-amd64-${{ env.CF_MONTH }}

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          mkdir -p ~/cf-bin
          if [ ! -x ~/cf-bin/cloudflared ]; then
            curl -L --retry 3 --output ~/cf-bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x ~/cf-bin/cloudflared
          else
            echo "cloudflared restored from cache."
          fi
          sudo install -m 0755 ~/cf-bin/cloudflared /usr/local/bin/cloudflared

      - name: Save cloudflared cache
        if: steps.cf_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/cf-bin
          key: cloudflared-linux-amd64-${{ env.CF_MONTH }}

      - name: Wait for Previous Workflow Runs to Complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The older run must finish (stop server + final snapshot) BEFORE this run restores.
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          while true; do
            # Agar is se NAYA run bhi aa chuka hai to yeh run kaam ka nahi (abhi tak server/DB ko haath nahi lagaya):
            # khud ko cancel kar do, warna har beech wala run pip install + restore + server start karke
            # tab jaakar band hota hai aur chain mein minute-ghante lag jate hain. Sirf push runs cancel hote hain
            # (backup_now / restore_now / migrate_now wali requests kabhi cancel nahi hoti).
            if [ "${{ github.event_name }}" = "push" ]; then
              LATEST_RUN_ID=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "$CURRENT_RUN_ID")
              if [ -n "$LATEST_RUN_ID" ] && [ "$LATEST_RUN_ID" -gt "$CURRENT_RUN_ID" ]; then
                echo "Newer run ($LATEST_RUN_ID) already exists -> this run is superseded. Cancelling (nothing started yet)."
                gh run cancel "$CURRENT_RUN_ID" -R "$REPO" || true
                sleep 120
                exit 1
              fi
            fi
            # Atke hue ("ghost") queued runs: 15 minute se zyada purane queued runs asal mein kabhi shuru nahi hue
            # (normal Cancel bhi "Failed to cancel" deta hai). Unhein force-cancel karo aur intezar mein mat gino.
            RUNS_JSON=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=30" 2>/dev/null || echo '{"workflow_runs":[]}')
            for ID in $(echo "$RUNS_JSON" | jq -r --argjson cur "$CURRENT_RUN_ID" '.workflow_runs[] | select(.id < $cur and .status == "queued" and ((now - (.created_at | fromdateiso8601)) > 900)) | .id'); do
              echo "Stale queued run $ID (15+ min) -> force-cancel"
              gh api -X POST "repos/$REPO/actions/runs/$ID/force-cancel" >/dev/null 2>&1 || gh run cancel "$ID" -R "$REPO" || true
            done
            OLDER_RUNS=$(echo "$RUNS_JSON" | jq -c --argjson cur "$CURRENT_RUN_ID" '[.workflow_runs[] | select(.id < $cur and (.status == "in_progress" or (.status == "queued" and ((now - (.created_at | fromdateiso8601)) <= 900)))) | .id]')
            TOTAL_PENDING=$(echo "$OLDER_RUNS" | jq 'length')
            if [ "${TOTAL_PENDING:-0}" -gt 0 ]; then
              echo "Older run(s) $OLDER_RUNS still active. Holding (ID: $CURRENT_RUN_ID)..."
              sleep 3
            else
              echo "No older active runs. Proceeding."
              break
            fi
          done

      - name: Parse Trigger Source & Inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VAL: ${{ github.event.inputs.restore_action }}
          CLIENT_PAYLOAD_FILE: ${{ github.event.client_payload.file }}
        run: |
          RESTORE_TARGET="latest"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            ACTION_TYPE="${{ github.event.action }}"
            if [ "$ACTION_TYPE" = "restore_now" ]; then
              RESTORE_TARGET="${CLIENT_PAYLOAD_FILE:-latest}"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Web trigger: waiting 10 seconds buffer..."
            sleep 10
            if [ -n "$INPUT_VAL" ]; then RESTORE_TARGET="$INPUT_VAL"; fi
          fi
          echo "RESTORE_TARGET=$RESTORE_TARGET" >> "$GITHUB_ENV"
          # latest -> placeholder key (never exists, so restore-keys prefix picks the newest entry)
          # otherwise the given value is treated as an exact cache key
          if [ "$RESTORE_TARGET" = "latest" ] || [ "$RESTORE_TARGET" = "r" ] || [ "$RESTORE_TARGET" = "list" ] || [ "$RESTORE_TARGET" = "ls" ] || [ -z "$RESTORE_TARGET" ]; then
            echo "RESTORE_KEY=db-snapshot-latest-placeholder" >> "$GITHUB_ENV"
          else
            echo "RESTORE_KEY=$RESTORE_TARGET" >> "$GITHUB_ENV"
          fi
          echo "Restore target: $RESTORE_TARGET"

      - name: Setup Snapshot Helpers
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          echo "SNAP_DIR=$RUNNER_TEMP/snapshots" >> "$GITHUB_ENV"
          echo "HELPER_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

          # --- encrypt / decrypt helper (same Fernet scheme as old snapshots) ---
          cat > "$RUNNER_TEMP/crypt.py" <<'PYEOF'
          import base64, os, sys
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          mode, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32,
                           salt=b'django_backup_salt_2026', iterations=100000)
          f = Fernet(base64.urlsafe_b64encode(kdf.derive(os.environ['BACKUP_SECRET_KEY'].encode())))
          data = open(src, 'rb').read()
          open(dst, 'wb').write(f.encrypt(data) if mode == 'enc' else f.decrypt(data))
          PYEOF

          # --- snapshot script: dump -> sanity check -> encrypt -> write to SNAP_DIR (saved to cache at job end) ---
          cat > "$RUNNER_TEMP/snapshot.sh" <<'SHEOF'
          #!/usr/bin/env bash
          # usage: snapshot.sh <periodic|final>
          MODE="${1:-periodic}"
          cd "$GITHUB_WORKSPACE"
          exec 9>"$HELPER_DIR/snapshot.lock"
          flock 9
          set -uo pipefail

          # --- license.key lives in a file, not in the DB: keep an encrypted copy in the cache dir ---
          if [ -f license.key ]; then
            python "$HELPER_DIR/crypt.py" enc license.key "$SNAP_DIR/license.key.enc" \
              && echo "[snapshot:$MODE] license.key stored" \
              || echo "[snapshot:$MODE] license.key store FAILED"
          fi

          TS=$(date +"%Y%m%d_%H%M%S")
          NAME="db_snapshot_${TS}.sql.gz.enc"
          RAW="$HELPER_DIR/raw_${TS}.sql.gz"

          if ! MYSQL_PWD=root mysqldump -h 127.0.0.1 -P 3306 -u root \
                --set-gtid-purged=OFF --column-statistics=0 --single-transaction \
                --no-tablespaces local_django_db | gzip > "$RAW"; then
            echo "[snapshot:$MODE] mysqldump FAILED - nothing uploaded"; exit 1
          fi

          NEW_SIZE=$(stat -c %s "$RAW")
          OLD_SIZE=$(cat "$HELPER_DIR/restored_size" 2>/dev/null || echo 0)
          # Safety: never overwrite good history with a near-empty dump
          if [ "$NEW_SIZE" -lt 5000 ] || { [ "$OLD_SIZE" -gt 0 ] && [ "$NEW_SIZE" -lt $((OLD_SIZE / 2)) ]; }; then
            echo "[snapshot:$MODE] SUSPICIOUS dump size ($NEW_SIZE bytes vs restored $OLD_SIZE) - upload skipped"
            curl -s -H "Title: DB snapshot SKIPPED (suspicious size)" -H "Tags: warning" \
              -d "new=$NEW_SIZE restored=$OLD_SIZE run=$GITHUB_RUN_ID" ntfy.sh/hassan_shops_db || true
            rm -f "$RAW"; exit 1
          fi

          python "$HELPER_DIR/crypt.py" enc "$RAW" "$HELPER_DIR/$NAME" || { echo "encrypt failed"; exit 1; }
          # keep only the newest snapshot in SNAP_DIR (the cache entry stays small)
          rm -f "$SNAP_DIR"/db_snapshot_*.enc
          mv "$HELPER_DIR/$NAME" "$SNAP_DIR/$NAME"
          rm -f "$RAW"
          echo "[snapshot:$MODE] stored $NAME ($NEW_SIZE bytes raw)"

          if [ "$MODE" = "final" ]; then
            curl -s -H "Title: DB Backup Successful" -H "Tags: white_check_mark,database" \
              -d "Snapshot: $NAME (raw $NEW_SIZE bytes)" ntfy.sh/hassan_shops_db || true
          fi
          SHEOF
          chmod +x "$RUNNER_TEMP/snapshot.sh"

      - name: List available cache snapshots
        if: ${{ env.RESTORE_TARGET == 'list' || env.RESTORE_TARGET == 'ls' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== AVAILABLE SNAPSHOTS (cache keys) ==="
          gh cache list -R "${{ github.repository }}" --key db-snapshot- --sort created_at --order desc || true
          echo "=== list done; continuing with LATEST ==="

      - name: Restore snapshot from GitHub cache
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/snapshots
          key: ${{ env.RESTORE_KEY }}
          restore-keys: |
            db-snapshot-

      - name: Restore Database from cache (or start fresh)
        run: |
          echo "Cache matched key: '${{ steps.restore_cache.outputs.cache-matched-key }}'"

          FILE=$(ls "$SNAP_DIR"/db_snapshot_*.enc 2>/dev/null | sort | tail -n 1 || true)

          # --- license.key: cache copy wins (it has the latest renewal); else bootstrap from secret LICENSE_KEY ---
          if [ -f "$SNAP_DIR/license.key.enc" ]; then
            python "$HELPER_DIR/crypt.py" dec "$SNAP_DIR/license.key.enc" ./license.key \
              && echo "License restored from cache."
          elif [ -n "${LICENSE_KEY:-}" ]; then
            printf '%s' "$LICENSE_KEY" > ./license.key
            echo "License written from secret LICENSE_KEY."
          else
            echo "No license in cache and no LICENSE_KEY secret (trial/read-only rules apply)."
          fi
          [ -f license.key ] && sha256sum license.key | cut -d' ' -f1 > "$HELPER_DIR/license_hash"

          if [ -z "$FILE" ]; then
            echo "No snapshot in cache -> FIRST RUN, starting with a fresh empty database."
            echo "0" > "$HELPER_DIR/restored_size"
            echo "DB_READY=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Restoring snapshot: $(basename "$FILE")"
          python "$HELPER_DIR/crypt.py" dec "$FILE" ./restored.sql.gz
          stat -c %s ./restored.sql.gz > "$HELPER_DIR/restored_size"
          gunzip -c ./restored.sql.gz > ./restored.sql

          MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root -e "DROP DATABASE IF EXISTS local_django_db; CREATE DATABASE local_django_db CHARACTER SET utf8mb4;"
          MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root local_django_db < ./restored.sql
          rm -f ./restored.sql ./restored.sql.gz

          TABLES=$(MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='local_django_db';")
          echo "Restore OK: $TABLES tables loaded."
          echo "DB_READY=true" >> "$GITHUB_ENV"

      - name: Apply Migrations & Ensure Superuser
        run: |
          python manage.py makemigrations --noinput || true
          if python manage.py migrate --noinput; then
            echo "Migrations applied."
          else
            echo "Migration conflict. Forcing state sync with --fake..."
            python manage.py migrate --fake --noinput
          fi

          python manage.py shell -c "
          import os
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              user, created = User.objects.get_or_create(username=username, defaults={'email': email})
              user.set_password(password)
              user.is_staff = True
              user.is_superuser = True
              user.save()
              print(f'Superuser {username} verified.')
          else:
              print('Skipping superuser (credentials not set).')
          "

      - name: Expire finished vendor launch offers
        run: python manage.py expire_commission_promos || true

      - name: Email setup check (secrets ki qeemat nahi dikhata)
        run: python manage.py check_email || true

      - name: Stop Here for migrate_now
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'migrate_now' }}
        run: |
          bash "$HELPER_DIR/snapshot.sh" final || true
          curl -d "Forced migration done on local DB and snapshot saved." ntfy.sh/hshshehgag
          echo "STOP_AFTER_MIGRATE=true" >> "$GITHUB_ENV"

      - name: Process & Place PWA Icons from Project Root
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          python -c "
          import os
          from PIL import Image

          project_dir = os.getcwd()
          target_dir = os.path.join(project_dir, 'ceo_module', 'static', 'ceo', 'images')
          os.makedirs(target_dir, exist_ok=True)
          extensions = ('.png', '.jpg', '.jpeg', '.webp')
          found_images = [os.path.join(project_dir, f) for f in os.listdir(project_dir) if f.lower().endswith(extensions)]
          if not found_images:
              print('No source image found in project root.')
          else:
              src = found_images[0]
              print(f'Processing source image: {src}')
              with Image.open(src) as img:
                  img = img.convert('RGBA')
                  for w, h, fn in [(192, 192, 'icon-192.png'), (512, 512, 'icon-512.png')]:
                      img.resize((w, h), Image.Resampling.LANCZOS).save(os.path.join(target_dir, fn), 'PNG')
                      print(f'Saved: {fn}')
          "

      - name: Collect Static Files
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          mkdir -p static
          python manage.py collectstatic --noinput --clear

      - name: Check and Kill Existing Local Processes
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          pkill -f "manage.py runserver" || true
          pkill -f "gunicorn_app:application" || true
          pkill -f "cloudflared" || true
          sleep 2

      - name: Start Django Server & Cloudflare Tunnel (fixed domain)
        if: env.STOP_AFTER_MIGRATE != 'true'
        run: |
          touch django.log tunnel.log

          start_runserver() {
            PYTHONUNBUFFERED=1 python -u manage.py runserver 0.0.0.0:8000 --insecure >> django.log 2>&1 &
          }

          # ---- Production server: gunicorn (falls back to runserver by itself if it cannot start) ----
          # The project settings are not part of this workflow, so the WSGI module is detected at runtime.
          WSGI_FILE=$(find . -maxdepth 2 -name wsgi.py -not -path "./venv/*" -not -path "./.git/*" | head -n 1)
          WSGI_MODULE=""
          if [ -n "$WSGI_FILE" ]; then
            WSGI_MODULE=$(echo "${WSGI_FILE#./}" | sed 's#\.py$##; s#/#.#g')
          fi
          echo "WSGI module: ${WSGI_MODULE:-NOT FOUND}"

          cat > gunicorn_app.py <<'PYEOF'
          import os
          from importlib import import_module

          application = import_module(os.environ["WSGI_MODULE"]).application
          # runserver --insecure used to serve /static/; gunicorn does not, so wrap the app with WhiteNoise
          # (harmless if the project already uses the WhiteNoise middleware).
          try:
              from django.conf import settings
              from whitenoise import WhiteNoise
              _root = getattr(settings, "STATIC_ROOT", None)
              _url = str(getattr(settings, "STATIC_URL", "/static/") or "/static/")
              if _root and os.path.isdir(str(_root)) and not _url.startswith("http"):
                  application = WhiteNoise(application, root=str(_root), prefix=_url.strip("/"))
                  print("WhiteNoise serving static files from", _root, "at", _url, flush=True)
          except Exception as exc:  # never stop the site because of this wrapper
              print("WhiteNoise wrapper skipped:", exc, flush=True)
          PYEOF

          GUNICORN_OK=""
          if [ -n "$WSGI_MODULE" ] && command -v gunicorn >/dev/null 2>&1; then
            export WSGI_MODULE
            # 1 worker + 8 threads = same single-process behaviour as runserver (in-memory caches stay consistent),
            # but with request timeouts, graceful stop and a proper production server.
            PYTHONUNBUFFERED=1 gunicorn gunicorn_app:application \
              --bind 0.0.0.0:8000 --worker-class gthread --workers 1 --threads 8 \
              --timeout 120 --graceful-timeout 25 --keep-alive 5 \
              --access-logfile - --error-logfile - --capture-output >> django.log 2>&1 &
            GUNI_PID=$!
            for i in {1..40}; do
              CODE=$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:8000/ || true)
              kill -0 "$GUNI_PID" 2>/dev/null || break      # gunicorn itself died -> fallback
              if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then GUNICORN_OK="yes"; break; fi
              sleep 2
            done
          fi
          if [ -n "$GUNICORN_OK" ]; then
            echo "Server: gunicorn is up (HTTP $CODE)."
            echo gunicorn > .server_mode
          else
            echo "gunicorn did NOT start -> falling back to runserver. Last log lines:"
            tail -n 30 django.log || true
            pkill -f "gunicorn_app:application" || true
            sleep 1
            start_runserver
            echo runserver > .server_mode
            curl -s -H "Title: gunicorn failed - using runserver" -H "Tags: warning" -d "run=${{ github.run_id }}" ntfy.sh/hassan_shops_db || true
          fi
          # Named tunnel: token from secret CLOUDFLARE_TOKEN, hostname is set in Cloudflare Zero Trust dashboard
          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TOKEN" > tunnel.log 2>&1 &
          # periodic snapshot every 30 min (local copy; saved to cache at job end)
          setsid nohup bash -c 'while true; do sleep 1800; bash "$HELPER_DIR/snapshot.sh" periodic; done' > periodic_snapshot.log 2>&1 &

          # ---- WATCHDOG: restarts the web server if it crashes or stops answering (checks every 20 s) ----
          cat > server_watchdog.sh <<'WDEOF'
          #!/usr/bin/env bash
          MODE="$(cat .server_mode 2>/dev/null || echo gunicorn)"
          FAILS=0
          start_server() {
            if [ "$MODE" = "gunicorn" ]; then
              PYTHONUNBUFFERED=1 gunicorn gunicorn_app:application \
                --bind 0.0.0.0:8000 --worker-class gthread --workers 1 --threads 8 \
                --timeout 120 --graceful-timeout 25 --keep-alive 5 \
                --access-logfile - --error-logfile - --capture-output >> django.log 2>&1 &
            else
              PYTHONUNBUFFERED=1 python -u manage.py runserver 0.0.0.0:8000 --insecure >> django.log 2>&1 &
            fi
          }
          sleep 60   # give the server time to finish starting
          while true; do
            sleep 20
            CODE=$(curl -s -o /dev/null -m 10 -w '%{http_code}' http://127.0.0.1:8000/ || true)
            if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then FAILS=$((FAILS+1)); else FAILS=0; fi
            if [ "$FAILS" -ge 3 ]; then
              echo "[watchdog] $(date) server not answering -> restarting ($MODE)" >> django.log
              pkill -KILL -f "gunicorn_app:application" || true
              pkill -KILL -f "manage.py runserver" || true
              sleep 2
              start_server
              curl -s -H "Title: Server crashed - watchdog restarted it" -H "Tags: warning" -d "mode=$MODE" ntfy.sh/hassan_shops_db || true
              FAILS=0
              sleep 40
            fi
          done
          WDEOF
          setsid nohup bash server_watchdog.sh > watchdog.log 2>&1 &

          TUNNEL_OK=""
          for i in {1..30}; do
            if grep -q "Registered tunnel connection" tunnel.log; then TUNNEL_OK="yes"; break; fi
            sleep 2
          done

          TUNNEL_URL="https://$SITE_DOMAIN"
          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          if [ -z "$TUNNEL_OK" ]; then
            echo "!!! Tunnel connect hota nazar nahi aaya. tunnel.log:"
            cat tunnel.log
          else
            echo ""
            echo "=============================================="
            echo "  LIVE URL: $TUNNEL_URL"
            echo "=============================================="
            echo ""
          fi

      - name: Realtime HTTP Access Logs & Error Stream
        if: env.STOP_AFTER_MIGRATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          RELAUNCHED=""
          NEWER_SINCE=""
          for i in {1..65}; do
            for s in {1..60}; do
              # ---- AUTO-RESTART before GitHub's 6 hour limit (18600 s = 5h10m after job start) ----
              ELAPSED=$(( $(date +%s) - JOB_START ))
              if [ -z "$RELAUNCHED" ] && [ "$ELAPSED" -ge 18600 ]; then
                if gh workflow run deploy.yml --ref "$BRANCH" -R "$REPO"; then
                  echo "Auto-restart: new run requested after ${ELAPSED}s. This run will hand over now."
                  RELAUNCHED="yes"
                else
                  echo "Auto-restart request FAILED, will retry..."
                  curl -s -H "Title: Auto-restart FAILED (retrying)" -H "Tags: warning" -d "run=$CURRENT_RUN_ID" ntfy.sh/hassan_shops_db || true
                fi
              fi
              LATEST_RUN_ID=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "$CURRENT_RUN_ID")
              if [ "$LATEST_RUN_ID" -gt "$CURRENT_RUN_ID" ]; then
                # FAST HANDOVER: keep serving until the NEW run has finished installing and is only waiting for us
                # (its "Wait for Previous Workflow Runs" step is running), or 8 minutes passed. Then stop + final snapshot.
                if [ -z "$NEWER_SINCE" ]; then
                  NEWER_SINCE=$(date +%s)
                  echo "Newer run ($LATEST_RUN_ID) detected. Site stays UP while it installs (max 8 min)."
                fi
                NEW_STATE=$(gh api "repos/$REPO/actions/runs/$LATEST_RUN_ID/jobs" --jq '[.jobs[].steps[]? | select(.name == "Wait for Previous Workflow Runs to Complete") | .status] | first // "none"' 2>/dev/null || echo "none")
                WAITED=$(( $(date +%s) - NEWER_SINCE ))
                if [ "$NEW_STATE" = "in_progress" ] || [ "$NEW_STATE" = "completed" ] || [ "$WAITED" -ge 480 ]; then
                  echo "New run ready (state=$NEW_STATE, waited ${WAITED}s). Ending log stream -> final snapshot."
                  exit 0
                fi
              fi
              sleep 5
            done
            echo "------------------------------------------"
            echo "TIMESTAMP: $(date)"
            echo "--- SERVER HTTP ACCESS LOGS ---"
            grep -E '"GET|POST|PUT|DELETE|HEAD' django.log | tail -n 50 || echo "No HTTP requests logged yet."
            echo "--- RECENT EXCEPTIONS / ERRORS ---"
            grep -i -C 3 "error\|exception\|traceback" django.log | tail -n 50 || echo "No errors detected."
          done || true

      - name: Final Snapshot (stop server first)
        if: ${{ always() && env.DB_READY == 'true' && env.STOP_AFTER_MIGRATE != 'true' }}
        run: |
          # Stop writers first so nothing is written after the snapshot
          pkill -f "server_watchdog.sh" || true               # must stop first, else it would restart the server
          pkill -f "cloudflared" || true                      # no new requests
          pkill -f "snapshot.sh" || true
          pkill -TERM -f "gunicorn_app:application" || true   # graceful: running requests finish (max 25 s)
          pkill -f "manage.py runserver" || true
          for i in {1..30}; do
            pgrep -f "gunicorn_app:application" >/dev/null 2>&1 || break
            sleep 1
          done
          pkill -KILL -f "gunicorn_app:application" || true
          sleep 1
          bash "$HELPER_DIR/snapshot.sh" final || true

      - name: Check snapshot exists
        if: ${{ always() && env.DB_READY == 'true' }}
        run: |
          if ls "$SNAP_DIR"/db_snapshot_*.enc >/dev/null 2>&1; then
            echo "HAVE_SNAP=true" >> "$GITHUB_ENV"
          else
            echo "No snapshot file to save - cache save skipped."
          fi

      - name: Export snapshot as downloadable file (Actions page -> this run -> Artifacts)
        # Encrypted copy you can download and keep OUTSIDE GitHub's cache (needed to move to another server).
        # Only the encrypted files are uploaded; without BACKUP_SECRET_KEY they cannot be opened.
        if: ${{ always() && env.HAVE_SNAP == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshots/*.enc
          retention-days: 14
          if-no-files-found: ignore

      - name: Save snapshot to GitHub cache
        if: ${{ always() && env.HAVE_SNAP == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/snapshots
          key: db-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Rotate old cache entries (keep latest 3)
        if: ${{ always() && env.HAVE_SNAP == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" --key db-snapshot- --sort created_at --order desc --limit 100 --json id,key \
            --jq '.[3:][] | .id' | while read -r ID; do
              [ -n "$ID" ] && gh cache delete "$ID" -R "${{ github.repository }}" && echo "rotated out cache id $ID"
            done || true

      - name: Rotate old exported files (keep latest 3)
        if: ${{ always() && env.HAVE_SNAP == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("db-export-")) | select(.expired == false) | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +4 | while read -r TS ID; do
                [ -n "$ID" ] && gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" >/dev/null && echo "rotated out exported file $ID"
              done || true

      - name: Safety net - start next run if none was started
        # Runs also if the log stream ended early. Not on cancel (cancelled() = you stopped it on purpose),
        # and only if this run lived 3h+ (so a crashing run cannot restart itself in an endless loop).
        if: ${{ !cancelled() && env.DB_READY == 'true' && env.STOP_AFTER_MIGRATE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START ))
          LATEST_RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "0")
          if [ "$ELAPSED" -lt 10800 ]; then
            echo "Run lasted only ${ELAPSED}s (< 3h) -> not auto-restarting."
          elif [ "$LATEST_RUN_ID" -gt "${{ github.run_id }}" ]; then
            echo "A newer run ($LATEST_RUN_ID) already exists -> nothing to do."
          else
            gh workflow run deploy.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}" && echo "Next run started."
          fi
