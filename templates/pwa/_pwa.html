{% load pwa %}
{% progressive_web_app_meta %}
<meta name="mobile-web-app-capable" content="yes">
<script>
/* Install button (Android/Chrome/Edge) + iPhone hint. */
(function () {
  var deferred = null, KEY = 'pwa_install_dismissed';
  function standalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function bar(html, onclick) {
    if (document.getElementById('pwa-install-bar')) return;
    var b = document.createElement('div');
    b.id = 'pwa-install-bar';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#0d6efd;color:#fff;' +
      'border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);' +
      'font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto';
    b.innerHTML = '<span style="flex:1">' + html + '</span>' +
      (onclick ? '<button id="pwa-yes" style="background:#fff;color:#0d6efd;border:0;border-radius:8px;padding:8px 14px;font-weight:600">Install</button>' : '') +
      '<button id="pwa-no" aria-label="Close" style="background:transparent;color:#fff;border:0;font-size:20px;line-height:1">&times;</button>';
    document.body.appendChild(b);
    document.getElementById('pwa-no').onclick = function () {
      try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      b.remove();
    };
    if (onclick) document.getElementById('pwa-yes').onclick = function () { onclick(); b.remove(); };
  }
  function dismissed() {
    try { var t = +localStorage.getItem(KEY); return t && Date.now() - t < 7 * 864e5; } catch (e) { return false; }
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (standalone() || dismissed()) return;
    var show = function () {
      bar('📲 App install karein — home screen se seedha khulegi', function () {
        deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; });
      });
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  });
  window.addEventListener('appinstalled', function () {
    var b = document.getElementById('pwa-install-bar'); if (b) b.remove();
  });
  document.addEventListener('DOMContentLoaded', function () {
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    if (ios && !standalone() && !dismissed()) {
      bar('iPhone: Share ⬆️ dabayein phir <b>Add to Home Screen</b>', null);
    }
  });
})();
</script>
