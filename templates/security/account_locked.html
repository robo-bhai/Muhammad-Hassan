<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account temporarily locked</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f8;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.box{background:#fff;max-width:420px;margin:16px;padding:32px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
h1{font-size:1.25rem;margin:0 0 12px}p{color:#555;line-height:1.5}a{color:#0d6efd}</style></head>
<body><div class="box">
<h1>Too many failed attempts</h1>
<p>For security, sign-in is paused for this account. Please try again in about <strong>{{ minutes }}</strong> minute{{ minutes|pluralize }}.</p>
<p>If you forgot your password, ask your administrator to reset it or unlock the account.</p>
<p><a href="javascript:history.back()">&larr; Back</a></p>
</div></body></html>
