<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d6efd">
<title>Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2937;text-align:center;padding:24px}
  .box{max-width:360px}
  .ic{font-size:64px}
  h1{font-size:22px;margin:12px 0 6px}
  p{color:#6b7280;margin:0 0 20px;line-height:1.5}
  button{background:#0d6efd;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">📡</div>
    <h1>Internet nahi hai</h1>
    <p>You are offline. Connection wapas aate hi dobara try karein.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
  <script>window.addEventListener('online', function(){ location.reload(); });</script>
</body>
</html>
